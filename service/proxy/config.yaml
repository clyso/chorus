address: "http://localhost:9669" # Chorus proxy s3 api address
port: 9669
cors:
  enabled: false
  allowAll: false
  whitelist:
auth:
  allowV2Signature: false
  useStorage: # use credentials from one of configured storages <one|two>
  custom: # OR use custom credentials for proxy s3 endpoint: user -> alias -> credential
#    user1:
#      alias1: # alias name for the credential, e.g. laptop or ci
#        accessKeyID: <user1 alias1 v4 accessKey credential>
#        secretAccessKey: <user1 alias1 v4 secretKey credential>
#    user2:
#      alias1:
#        accessKeyID: <user2 alias1 v4 accessKey credential>
#        secretAccessKey: <user2 alias1 v4 secretKey credential>
storage:
  defaultRegion: "us-east-1" # fallback region. Will be used if origin region is not supported by replication destination
  dynamicCredentials:
    enabled: false # set true to enable to manage storage credentials via API
    disableEncryption: false
    masterPassword: "" # master password to encrypt/decrypt storage credentials.
    pollInterval: 3s # poll interval to check for updated credentials by chorus replicas
  storages:
