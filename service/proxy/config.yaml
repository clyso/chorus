#            secretAccessKey: <user1 alias1 v4 secretKey credential>
#          alias2:
#            accessKeyID: <user1 alias2 v4 accessKey credential>
#            secretAccessKey: <user1 alias2 v4 secretKey credential>
#        user2:
#          alias1:
#            accessKeyID: <user2 alias1 v4 accessKey credential>
#            secretAccessKey: <user2 alias1 v4 secretKey credential>
#      provider: <Ceph|Minio|Other> # S3 provider name. Required to use provider-specific APIs, like keeping original versionID. Use 'Other' if your storage is S3 compatible but not listed.
#      isMain: true # <true|false> one of the storages in should be main
#      healthCheckInterval: 10s
#      httpTimeout: 1m
#      isSecure: true #set false for http address
#      rateLimit:
#        enable: true
#        rpm: 60
