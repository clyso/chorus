{{- /* Worker storage credentials secret (user -> credential) */}}
{{- if include "chorus.createCredentialsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chorus.credentialsSecretName" . }}
  labels:
    {{- include "chorus.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- if .Values.credentials.storages }}
    storage:
      storages:
        {{- range $storageName, $users := .Values.credentials.storages }}
        {{ $storageName }}:
          credentials:
            {{- $users | toYaml | nindent 12 }}
        {{- end }}
    {{- end }}
{{- end }}
---
{{- /* Proxy storage credentials secret (user -> alias -> credential) */}}
{{- if include "chorus.createProxyCredentialsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chorus.proxyCredentialsSecretName" . }}
  labels:
    {{- include "chorus.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- if .Values.proxyCredentials.storages }}
    storage:
      storages:
        {{- range $storageName, $users := .Values.proxyCredentials.storages }}
        {{ $storageName }}:
          credentials:
            {{- $users | toYaml | nindent 12 }}
        {{- end }}
    {{- end }}
{{- end }}
---
{{- /* Dynamic credentials master password secret */}}
{{- if include "chorus.createDynamicCredentialsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chorus.dynamicCredentialsSecretName" . }}
  labels:
    {{- include "chorus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "chorus.dynamicCredentialsSecretKey" . }}: {{ .Values.dynamicCredentials.masterPassword | quote }}
{{- end }}
